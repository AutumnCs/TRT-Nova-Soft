<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能花盆 Smart Pot MVP Prototype</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            green: '#10B981',
                            light: '#D1FAE5',
                            dark: '#065F46',
                            bg: '#F3F4F6'
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'inner-light': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.3)'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        /* Hide Scrollbar but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* iPhone 15 Pro Frame Simulation */
        .iphone-frame {
            width: 393px; /* iPhone 15 Pro width */
            height: 852px; /* iPhone 15 Pro height */
            background-color: #fff;
            border-radius: 55px;
            position: relative;
            box-shadow: 
                0 0 0 12px #3e3e3e, /* Bezel */
                0 0 0 13px #252525, /* Inner Bezel Line */
                0 20px 50px -10px rgba(0,0,0,0.5); /* Drop Shadow */
            overflow: hidden;
            border: 8px solid #000;
        }

        .dynamic-island {
            width: 120px;
            height: 35px;
            background-color: #000;
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 20px;
            z-index: 50;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .status-badge {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        .chat-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }
    </style>
</head>
<body>

    <!-- iPhone Simulator -->
    <div class="iphone-frame flex flex-col bg-gray-50">
        
        <!-- Dynamic Island -->
        <div class="dynamic-island"></div>

        <!-- Status Bar -->
        <div class="h-14 w-full flex justify-between items-end px-6 pb-2 text-black z-40 bg-white/80 backdrop-blur-md sticky top-0">
            <div class="font-semibold text-sm">9:41</div>
            <div class="flex gap-1.5 items-center">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-full text-xs"></i>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 overflow-y-auto no-scrollbar pb-24 relative">
            
            <!-- Header -->
            <div class="px-6 pt-2 pb-4 flex justify-between items-center bg-white/50 backdrop-blur-sm sticky top-14 z-30">
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-bold text-gray-800">Nova (办公室)</h1>
                    <i class="fas fa-chevron-down text-gray-400 text-xs"></i>
                </div>
                <div class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden border border-white shadow-sm">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=100&auto=format&fit=crop" alt="User" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Plant Visualization Section -->
            <div class="relative w-full h-72 flex justify-center items-center mt-2">
                <!-- Background Glow -->
                <div class="absolute w-48 h-48 bg-brand-green/20 rounded-full blur-3xl"></div>
                
                <!-- Plant Image -->
                <div class="relative z-10 w-48 h-48 rounded-full overflow-hidden border-4 border-white shadow-soft">
                    <img src="https://images.unsplash.com/photo-1485955900006-10f4d324d411?q=80&w=600&auto=format&fit=crop" alt="Plant" class="w-full h-full object-cover">
                </div>

                <!-- Status Badges (Floating) -->
                <div class="absolute top-10 right-8 bg-red-50 text-red-500 text-xs font-bold px-3 py-1.5 rounded-full shadow-sm border border-red-100 transform rotate-12 status-badge" style="animation-delay: 0s;">
                    <i class="fas fa-temperature-arrow-up mr-1"></i> 湿度偏低
                </div>
                <div class="absolute bottom-16 left-6 bg-amber-50 text-amber-500 text-xs font-bold px-3 py-1.5 rounded-full shadow-sm border border-amber-100 transform -rotate-12 status-badge" style="animation-delay: 1.5s;">
                    <i class="fas fa-sun mr-1"></i> 光照适宜
                </div>
                
                <!-- Mood Icon -->
                <div class="absolute bottom-10 right-12 bg-white text-yellow-500 text-xl w-10 h-10 flex items-center justify-center rounded-full shadow-md border border-gray-100 z-20">
                    <i class="fas fa-face-smile"></i>
                </div>
            </div>

            <!-- Conversational Insight -->
            <div class="px-6 -mt-4 relative z-20">
                <div class="bg-white p-4 rounded-2xl shadow-soft text-center relative chat-bubble">
                    <p class="text-gray-700 font-medium text-sm">
                        "主人，我的土壤有点干了，可以给我喝点水吗？💧"
                    </p>
                </div>
            </div>

            <!-- Todo Cards -->
            <div class="px-6 mt-8">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">今日待办</h2>
                    <span class="text-xs text-brand-green font-semibold bg-brand-light px-2 py-0.5 rounded">2 项</span>
                </div>
                
                <div class="space-y-3">
                    <!-- Urgent Task -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-red-400 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-red-500">
                                <i class="fas fa-tint"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm">补充储水盒水量</h3>
                                <p class="text-xs text-red-500 font-medium">建议立即执行</p>
                            </div>
                        </div>
                        <button class="w-8 h-8 rounded-full border border-gray-200 flex items-center justify-center text-gray-300 hover:bg-brand-green hover:text-white hover:border-brand-green transition-colors">
                            <i class="fas fa-check text-sm"></i>
                        </button>
                    </div>

                    <!-- Upcoming Task -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-blue-400 flex items-center justify-between opacity-80">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-500">
                                <i class="fas fa-leaf"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm">施肥 (氮肥)</h3>
                                <p class="text-xs text-gray-400">计划：3天后</p>
                            </div>
                        </div>
                        <span class="text-xs font-medium text-gray-400">3天后</span>
                    </div>
                </div>
            </div>

            <!-- Plant Profile -->
            <div class="px-6 mt-8">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">植物档案</h2>
                    <i class="fas fa-arrow-right text-gray-400 text-xs"></i>
                </div>
                <div class="bg-gradient-to-r from-brand-dark to-brand-green p-5 rounded-2xl shadow-lg text-white relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-32 h-32 bg-white/10 rounded-full -mr-10 -mt-10 blur-xl"></div>
                    <h3 class="font-bold text-lg">芦荟 (Aloe Vera)</h3>
                    <p class="text-brand-light text-xs mt-1 mb-3">多肉植物 · 独尾草科</p>
                    <div class="flex gap-4 text-xs font-medium text-white/90">
                        <span class="flex items-center gap-1"><i class="fas fa-cloud text-white/70"></i> 喜阴</span>
                        <span class="flex items-center gap-1"><i class="fas fa-droplet text-white/70"></i> 耐旱</span>
                        <span class="flex items-center gap-1"><i class="fas fa-temperature-half text-white/70"></i> 20-30℃</span>
                    </div>
                </div>
            </div>

            <!-- Sensor Data Grid -->
            <div class="px-6 mt-8 mb-6">
                 <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider">实时监测</h2>
                    <span class="text-xs text-gray-400">刚刚更新</span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <!-- Temperature -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-1">
                        <i class="fas fa-thermometer-half text-green-500 text-lg mb-1"></i>
                        <span class="text-xl font-bold text-gray-800">25.4<span class="text-sm text-gray-400 font-normal">°C</span></span>
                        <span class="text-xs text-gray-400">环境温度</span>
                    </div>
                    <!-- Light -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-1 border border-amber-100">
                        <i class="fas fa-sun text-amber-500 text-lg mb-1"></i>
                        <span class="text-xl font-bold text-amber-600">1200<span class="text-sm text-gray-400 font-normal">lx</span></span>
                        <span class="text-xs text-gray-400">环境光照</span>
                    </div>
                    <!-- Humidity -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-1">
                        <i class="fas fa-droplet text-blue-400 text-lg mb-1"></i>
                        <span class="text-xl font-bold text-gray-800">47.7<span class="text-sm text-gray-400 font-normal">%</span></span>
                        <span class="text-xs text-gray-400">环境湿度</span>
                    </div>
                    <!-- Soil -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-1 border border-red-100 bg-red-50/30">
                        <i class="fas fa-water text-blue-600 text-lg mb-1"></i>
                        <span class="text-xl font-bold text-red-500">15.2<span class="text-sm text-gray-400 font-normal">%</span></span>
                        <span class="text-xs text-red-400 font-semibold">土壤过干</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Tab Bar -->
        <div class="h-20 bg-white border-t border-gray-100 flex justify-between items-start px-6 pt-4 pb-8 rounded-b-[45px] z-40">
            <div class="flex flex-col items-center gap-1 text-brand-green cursor-pointer">
                <i class="fas fa-home text-xl"></i>
                <span class="text-[10px] font-medium">首页</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 cursor-pointer transition-colors">
                <i class="fas fa-sliders text-xl"></i>
                <span class="text-[10px] font-medium">控制</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 cursor-pointer transition-colors">
                <i class="fas fa-chart-line text-xl"></i>
                <span class="text-[10px] font-medium">数据</span>
            </div>
             <div class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 cursor-pointer transition-colors">
                <i class="fas fa-book-open text-xl"></i>
                <span class="text-[10px] font-medium">百科</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600 cursor-pointer transition-colors">
                <i class="fas fa-user text-xl"></i>
                <span class="text-[10px] font-medium">我的</span>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-black rounded-full z-50"></div>

    </div>

</body>
</html>
