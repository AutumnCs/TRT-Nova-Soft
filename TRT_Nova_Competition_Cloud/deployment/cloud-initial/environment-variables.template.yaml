schemaVersion: "nova.cloud-candidate/v1"
kind: "ScfDirectEnvironmentContract"
metadata:
  status: "LASTSCF_DIRECT_ENV_IMPLEMENTED_CLOUD_ACCEPTANCE_PENDING"
  containsSecrets: false
  instruction: "tools/render-config.mjs emits public values and required secret variable NAMES only."
secretConfiguration:
  strategy: "SCF console environment variables, like LastScf"
  entryOrder: "SCF injects process.env -> index.main_handler"
  extraSecretServiceRequired: false
  note: "No SSM, separate COS bucket, Tencent API key or custom-domain gateway is required."
environmentBudgetContract:
  finalPerFunctionUtf8BytesMaxInclusive: 4096
  countingRule: "Count all names and actual values configured in SCF, including secrets. Record only the byte count locally."
  releaseEvidenceRequired: true
commonDatabase:
  plain:
    DB_HOST: "__FILL_MYSQL_HOST__"
    DB_PORT: "28245"
    DB_NAME: "__FILL_DATABASE_NAME__"
    DB_CONN_LIMIT: "5"
    DB_TLS_MODE: "legacy-direct"
  secretTargets: ["DB_USER", "DB_PASSWORD"]
  optionalTls: "private-network and required remain available but are not selected. required enables certificate and hostname checks; optionally set DB_SSL_CA in SCF."
  constraints: ["legacy-direct reuses the verified LastScf endpoint without TLS", "No automatic TLS downgrade or private-network claim", "Separate business database; existing DB account reused by user decision, without grants changes"]
media:
  functions: ["api-scf", "agent-scf", "history-cleanup-scf"]
  adapter: "cloud-media.js + cloudbase-storage.js"
  transport: "Official WeChat stable_token and tcb file HTTP APIs; cached token is server-only"
  plain:
    MEDIA_STORAGE_PROVIDER: "cloudbase"
    WECHAT_APPID: "__SAME_AS_AUTH_SCF_APPID__"
    CLOUDBASE_STORAGE_ENV_ID: "__FILL_THIS_PROJECT_CLOUDBASE_ENV_ID__"
    CLOUDBASE_STORAGE_REGION: "__FILL_CLOUDBASE_REGION__"
    CLOUDBASE_STORAGE_PREFIX: "nova-staging/staging/media/"
    LOCAL_MEDIA_ENABLED: "false"
  secretTargets: ["WECHAT_SECRET (same AppID owner as auth-scf)"]
  access: "Images and documents: wx.cloud.uploadFile, then SCF ownership/content verification and MySQL registration. No public ACL, client secret or BLOB fallback."
functions:
  auth-scf:
    secretTargets: ["WECHAT_SECRET", "JWT_SECRET"]
    plain: { WECHAT_APPID: "__FILL_WECHAT_APPID__", TOKEN_EXPIRES_IN_SECONDS: "604800" }
  api-scf:
    secretTargets: ["JWT_SECRET", "QWEATHER_PRIVATE_KEY if weather enabled"]
    plain: { ALLOW_LEGACY_OPENID_FALLBACK: "false", NOVA_DEVICE_COMMANDS_ENABLED: "false" }
    optionalWeather: ["QWEATHER_ENABLED", "QWEATHER_API_HOST", "QWEATHER_PROJECT_ID", "QWEATHER_CREDENTIAL_ID", "QWEATHER_TIMEOUT_MS"]
  agent-scf:
    secretTargets: ["JWT_SECRET", "LLM_API_KEY"]
    plain:
      ALLOW_LEGACY_OPENID_FALLBACK: "false"
      DEBUG_OPENID: ""
      AGENT_SHADOW_ENABLED: "false"
      AGENT_ROLLOUT_ENABLED: "true"
      AGENT_ROLLOUT_SAMPLE_RATE: "1"
      AGENT_ROLLOUT_MAX_STEPS: "3"
      AGENT_ROLLOUT_MAX_TOOL_CALLS: "5"
      AGENT_ROLLOUT_TIMEOUT_MS: "12000"
      AGENT_ROLLOUT_MAX_TOKENS: "700"
      LLM_API_ENABLED: "true"
      LLM_API_BASE_URL: "__FILL_HTTPS_LLM_BASE_URL__"
      LLM_API_PATH: "/chat/completions"
      LLM_MODEL: "__FILL_VERIFIED_TEXT_MODEL__"
      VISION_MODEL: "__FILL_VERIFIED_VISION_MODEL__"
      LLM_TIMEOUT_MS: "30000"
      LLM_MAX_TOKENS: "700"
      VISION_TIMEOUT_MS: "30000"
      VISION_MAX_TOKENS: "1800"
      VISION_IMAGE_DETAIL: "low"
    context: "Session context enabled by authenticated entry; cross-session opt-in remains per-user database state, not an env flag."
    budgetNote: "SCF server timeout 90s; client stays within 60s. Cold-start/slow-model acceptance is pending, not guaranteed by larger server budget."
  ingest-scf:
    enabledByDefault: false
    secretTargets: ["ONE_NET_TOKEN or EMQX_WEBHOOK_TOKEN", "ONE_NET_AES_KEY if encrypted"]
  history-cleanup-scf:
    plain: { NOVA_HISTORY_CLEANUP_ENABLED: "true", RAW_RETENTION_DAYS: "7", AGG_5M_RETENTION_DAYS: "7", AGG_1H_RETENTION_DAYS: "30", AGG_1D_RETENTION_DAYS: "365" }
    trigger: "SCF timer every minute, at most 2 unreferenced/expired CloudBase objects per invocation"
    preserved: "Full saved conversation and attachments have no automatic 20-turn/30-day deletion."
globalForbidden:
  - "DEBUG_OPENID, LOCAL_DEV_AUTH_ENABLED, legacy openid fallback"
  - "LOCAL_MEDIA_ENABLED=true or loopback database"
  - "Local key files, static Tencent credentials or secret values in frontend/config/ZIP/log"
releaseEvidence:
  - "Actual SCF environment configured; secret values absent from frontend/config/ZIP/log"
  - "Cloud MySQL migrations and actual legacy-direct/private-network/required connectivity"
  - "CloudBase AppID binding, private owner rules, WeChat API IP whitelist if required, native image/document upload and cleanup"
  - "Three independent Function URLs, legal domains and physical WeChat client"
